document.addEventListener("click",async function(e){var t=e.target.closest("#at [data-t]");if(t){AT=t.dataset.t;admin();return}
var b=e.target.closest("#ab [data-a]");if(!b)return;var a=b.dataset.a,i=b.dataset.i,m=document.getElementById("m"),x,mo;m.className="msg";m.textContent="";
function pm(){return prompt("Motivo (obrigatório):")}
if(a==="cfg"){var vs=[];for(var c=0;c<CK.length;c++){var el=document.getElementById("cfg_"+CK[c][0]),v=el.value.trim();if(CK[c][2]==="n"&&v&&!/^[0-9]+$/.test(v)){m.textContent="Usa só números inteiros, sem pontos nem vírgulas: "+CK[c][1];return}vs.push([CK[c][0],v])}
for(var d=0;d<vs.length;d++){var g=await sb.rpc("guardar_config",{p_chave:vs[d][0],p_valor:vs[d][1]||null});if(g.error){m.textContent=g.error.message;return}}
m.className="msg ok";m.textContent="Configurações guardadas.";return}
if(a==="pv"){var sg=await sb.storage.from("comprovativos").createSignedUrl(CP[i],300);if(sg.error){m.textContent=sg.error.message;return}m.innerHTML='<a class="btn" href="'+sg.data.signedUrl+'" target="_blank" rel="noopener">Abrir comprovativo</a>';return}
if(a==="pok")x=await sb.rpc("aprovar_pagamento",{p_id:i});
else if(a==="ps"||a==="pr"){mo=pm();if(!mo)return;x=await sb.rpc("alterar_pedido_estado",{p_id:i,p_estado:a==="ps"?"suspenso":"removido",p_motivo:mo})}
else if(a==="pa")x=await sb.rpc("alterar_pedido_estado",{p_id:i,p_estado:"ativo",p_motivo:""});
else if(a==="sc"){mo=pm();if(!mo)return;x=await sb.rpc("cancelar_subscricao",{p_id:i,p_motivo:mo})}
else if(a==="dt"){mo=pm();if(!mo)return;x=await sb.rpc("terminar_destaque",{p_id:i,p_motivo:mo})}
else if(a==="pud"){mo=pm();if(!mo)return;if(!confirm("Isto remove a subscrição ou o destaque ativado por este pagamento. Continuar?"))return;x=await sb.rpc("desfazer_aprovacao",{p_id:i,p_motivo:mo})}
else if(a==="pno"){mo=pm();if(!mo)return;x=await sb.rpc("rejeitar_pagamento",{p_id:i,p_motivo:mo})}
else if(a==="dm")x=await sb.rpc("decidir_denuncia",{p_id:i,p_acao:"manter",p_motivo:prompt("Nota (opcional):")||""});
else if(a==="dc"||a==="ds"||a==="dr"){mo=pm();if(!mo)return;x=await sb.rpc("decidir_denuncia",{p_id:i,p_acao:{dc:"correcao",ds:"suspender",dr:"remover"}[a],p_motivo:mo})}
else if(a==="as"||a==="ar"){mo=pm();if(!mo)return;x=await sb.rpc("alterar_anuncio_estado",{p_id:i,p_estado:a==="as"?"suspenso":"removido",p_motivo:mo})}
else if(a==="ap")x=await sb.rpc("alterar_anuncio_estado",{p_id:i,p_estado:"publicado",p_motivo:""});
else if(a==="vv"||a==="vn")x=await sb.rpc("definir_verificacao",{p_id:i,p_valor:a==="vv"?"verificado":"nao_verificado"});
else return;
if(x.error){m.textContent=x.error.message;return}admin()});
async function apagar(id){if(!confirm("Apagar este anúncio? Esta ação não pode ser desfeita."))return;
var f=await sb.from("fotografias").select("caminho").eq("anuncio_id",id);
if(f.data&&f.data.length)await sb.storage.from("fotos-anuncios").remove(f.data.map(function(x){return x.caminho}));
var d=await sb.from("anuncios").delete().eq("id",id);if(d.error){alert("Não foi possível apagar: "+d.error.message);return}
location.hash="#/meus";route()}
document.addEventListener("click",function(e){var b=e.target.closest("[data-del]");if(b)apagar(b.dataset.del)});
load();
</script>
