*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;overflow-x:hidden}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
header{background:var(--gd);color:#fff;position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top,0)}
.hd{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:22px;min-height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;line-height:1.1}.logo img{width:38px;height:38px;border-radius:10px}.logo img.lgw{width:auto;height:40px;padding:0;background:none;border-radius:0}.logo small{display:block;font-weight:400;font-size:11px;opacity:.85}
nav{display:flex;gap:6px;flex:1}nav a{padding:20px 10px 17px;font-size:14px;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}nav a.on{border-color:#fff;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:10px;border:1px solid transparent;background:var(--g);color:#fff;font-weight:600;cursor:pointer;font-size:16px}
.btn:hover{background:var(--gd)}.btn.out{background:#fff;color:var(--g);border-color:var(--g)}.btn.no{background:#fff;color:#B42318;border-color:#B42318}.btn.wh{background:#fff;color:var(--gd)}.btn[disabled]{opacity:.55}
main{max-width:1180px;margin:0 auto;padding:16px 20px 24px}
.full{margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);padding-left:calc(50vw - 50%);padding-right:calc(50vw - 50%)}
.box{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:0 2px 12px rgba(17,24,39,.06);margin-bottom:16px}
h1{font-size:28px;margin:0 0 6px;line-height:1.2}h2{font-size:20px;margin:0 0 10px}
.mut{color:var(--mut);font-size:14px}.msg{font-size:14px;min-height:20px;color:#B42318}.ok{color:var(--g)}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}.fld label{font-size:14px;font-weight:600}
input,select,textarea{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;color:var(--ink);width:100%}textarea{min-height:110px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.hero{margin-top:-16px;color:#fff;padding-top:56px;padding-bottom:84px;background:linear-gradient(100deg,#064E3B 0%,rgba(6,78,59,.92) 34%,rgba(6,95,70,.2) 100%),var(--himg) center/cover no-repeat,#065F46}
.hero h1{font-size:40px;max-width:460px;line-height:1.15;margin-bottom:10px}.hero p{margin:0 0 26px}
.sbar{background:#fff;color:var(--ink);border-radius:14px;padding:10px;display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;max-width:900px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.sf{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;padding:5px 12px;min-width:0}.sf label{font-size:12px;color:var(--mut)}.sf select,.sf input{border:0;min-height:28px;padding:2px 0;font-weight:600;font-size:14px;background:transparent}
.mf{max-width:900px;margin-top:10px}.mf summary{cursor:pointer;font-size:14px;padding:6px 0}.mf .fld label{color:#fff}
.ben{margin-top:-34px;position:relative;background:#fff;border-radius:var(--r);padding:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;box-shadow:0 4px 18px rgba(17,24,39,.08)}
.bi{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--mut)}.bi b{display:block;color:var(--ink);font-size:14px}
.ic{flex:none;width:42px;height:42px;border-radius:50%;background:var(--soft);color:var(--gd);display:grid;place-items:center;font-size:18px}
section{margin-top:32px}.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}.sh h2{font-size:26px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.pc{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:0 2px 12px rgba(17,24,39,.07);position:relative}
.pl{display:block}.ph{aspect-ratio:4/3;background:linear-gradient(160deg,#1c6b57,#8fb8a8) center/cover;position:relative}
.tag{position:absolute;top:10px;left:10px;background:var(--g);color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:6px}
.hr{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);border:0;color:var(--g);font-size:18px;cursor:pointer;z-index:2}
.cb{padding:14px}.cb h3{margin:0 0 2px;font-size:18px;line-height:1.3}.ft{color:var(--g);font-size:13px;margin:6px 0}.p{font-weight:700;color:var(--g);font-size:16px}
.cta{background:linear-gradient(90deg,rgba(6,95,70,0) 0,rgba(6,95,70,0) 12%,#065F46 28%,#087F5B 100%),var(--bimg) left center/auto 100% no-repeat,#065F46;color:#fff;border-radius:var(--r);padding:26px 28px 26px 200px;display:flex;align-items:center;gap:18px;margin-top:32px}
.cta h2{margin:0;font-size:20px}.cta p{margin:0;font-size:14px;opacity:.92}.cta div{flex:1}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.cat{background:#fff;border:0;border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;font-weight:600;cursor:pointer;text-align:left;box-shadow:0 2px 10px rgba(17,24,39,.05)}
footer{background:var(--gd);color:#fff;margin-top:40px;padding:32px 0 24px;font-size:14px}.fg{max-width:1180px;margin:0 auto;padding:0 20px;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:24px}.fg b{display:block;margin-bottom:8px}.fg a{display:block;opacity:.85;padding:2px 0}.copy{max-width:1180px;margin:20px auto 0;padding:0 20px;opacity:.7;font-size:12px}
.crumb{font-size:13px;color:var(--mut);margin-bottom:12px}
.dg{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
.big{position:relative;width:100%;aspect-ratio:16/10;border-radius:var(--r);background:linear-gradient(160deg,#1c6b57,#8fb8a8) center/cover}
.cnt{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:2px 10px;border-radius:999px}
.th{display:flex;gap:8px;margin-top:8px;overflow-x:auto}.th img{width:84px;height:62px;object-fit:cover;border-radius:8px;cursor:pointer;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.st{background:#F0FDF4;border-radius:10px;padding:10px;text-align:center;font-size:13px;color:var(--mut)}.st b{display:block;font-size:18px;color:var(--ink)}
.ctc{background:var(--soft);border-radius:var(--r);padding:16px;color:var(--gd)}.ctc b{display:block;font-size:16px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--gd)}
.badge.s-pendente,.badge.s-em_analise{background:#FEF3C7;color:#92400E}.badge.s-rejeitado{background:#FEE2E2;color:#991B1B}.badge.s-confirmado{background:#D1FAE5;color:#065F46}
.lock{background:var(--soft);color:var(--gd);border-radius:10px;padding:12px 14px;margin:10px 0}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:12px}.feat div{font-size:13px;color:var(--mut)}.feat b{display:block;color:var(--ink);font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}.tw{overflow-x:auto}
.badge.s-suspenso,.badge.s-removido,.badge.s-correcao_solicitada,.badge.s-aberta{background:#FEE2E2;color:#991B1B}.badge.s-mantido{background:#D1FAE5;color:#065F46}
.rl{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}.fp{position:sticky;top:80px}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:16px}.list .pl{display:grid;grid-template-columns:260px 1fr}.list .ph{aspect-ratio:auto;min-height:170px}
.pg{display:flex;gap:8px;justify-content:center;margin:20px 0}.pg button{min-width:40px;min-height:40px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}.pg button.on{background:var(--g);color:#fff;border-color:var(--g)}.pg button[disabled]{opacity:.4}
#ftg{display:none}
@media(max-width:900px){.rl{grid-template-columns:1fr}.fp{position:static}}
@media(max-width:720px){#ftg{display:block}.fp{display:none}.fp.open{display:block}.list .pl{grid-template-columns:1fr}.list .ph{aspect-ratio:16/9;min-height:0}}
.steps{list-style:none;padding:0;display:flex;margin:18px 0}.steps li{flex:1;text-align:center;font-size:12px;color:var(--mut);position:relative}
.steps li::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:2px;background:var(--line)}.steps li:first-child::before{display:none}
.steps i{position:relative;z-index:1;display:grid;place-items:center;width:32px;height:32px;margin:0 auto 6px;border-radius:50%;background:#fff;border:2px solid var(--line);font-style:normal;font-weight:700}
.steps li.on{color:var(--ink);font-weight:600}.steps li.on i{background:var(--g);border-color:var(--g);color:#fff}.steps li.done i{background:var(--soft);border-color:var(--g);color:var(--gd)}.steps li.on::before,.steps li.done::before{background:var(--g)}
.rc{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:60px}.rc input{width:18px;height:18px;min-height:0;accent-color:var(--g)}.rc small{display:block;color:var(--mut);font-weight:400;font-size:12px}.rc:has(input:checked){border-color:var(--g);background:var(--soft);color:var(--gd)}
.nv{display:flex;justify-content:space-between;gap:12px;margin-top:10px}.pn[hidden]{display:none}
.drop{display:block;border:2px dashed var(--g);border-radius:var(--r);padding:26px 14px;text-align:center;cursor:pointer}.drop b{display:block}
.pgd{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:12px}.pt{position:relative}.pt img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block}.pt .tag{left:6px;top:6px}
.rev{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}.rev img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px}.rev dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}.rev dt{color:var(--mut)}.rev dd{margin:0;font-weight:600;word-break:break-word}
.auth{max-width:440px;margin:16px auto}.ck{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px}.ck li::before{content:"✓ ";color:var(--g);font-weight:700}
.plan{display:flex;gap:12px;background:var(--soft);border-radius:var(--r);padding:14px;margin:12px 0;color:var(--gd)}.plan .mut{color:var(--gd)}
@media(max-width:720px){.steps span{display:none}.steps li.on span{display:block;position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;top:40px}.steps{margin-bottom:40px}.rev{grid-template-columns:1fr}}
.badge.s-cancelada,.badge.s-expirada,.badge.s-terminado{background:#E5E7EB;color:#374151}
.cats{grid-template-columns:repeat(4,1fr);gap:14px}
.ct{background:#F3F8F8;border:1px solid #E3EEEA;border-radius:18px;padding:10px 8px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;color:var(--gd);font-size:15px;transition:transform .15s,box-shadow .15s}
.ct:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(6,95,70,.15)}.ct img{width:100%;aspect-ratio:400/330;object-fit:contain;display:block}
@media(max-width:900px){.cats{grid-template-columns:repeat(2,1fr)}}
.map{height:320px;border-radius:12px;margin:8px 0 12px;position:relative;z-index:0;isolation:isolate}
.pin span{display:block;width:26px;height:26px;background:#087F5B;border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.mapfake{height:170px;border-radius:12px;margin-bottom:10px;position:relative;overflow:hidden;background:#E3EEEA repeating-linear-gradient(45deg,transparent 0 18px,rgba(8,127,91,.10) 18px 20px),repeating-linear-gradient(-30deg,transparent 0 26px,rgba(8,127,91,.12) 26px 28px);filter:blur(1.5px)}
.pinfake{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-20px 0 0 -15px;background:#087F5B;border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.mpb{display:inline-block;font-size:12px;font-weight:600;color:var(--gd);background:var(--soft);padding:2px 10px;border-radius:999px;margin:2px 0 4px}
.tabbar{display:none}
@media(max-width:900px){.dg{grid-template-columns:1fr}.ben{grid-template-columns:1fr 1fr}.fg{grid-template-columns:1fr 1fr}}
@media(max-width:720px){
nav{display:none}.hd{min-height:56px;padding:0 16px}.logo{margin-right:auto}
main{padding:12px 16px 24px}.hero{margin-top:-12px;padding-top:30px;padding-bottom:70px}.hero h1{font-size:30px}
.sbar{grid-template-columns:1fr}.sbar .btn{width:100%}
.hero{box-shadow:inset 0 0 0 100vmax rgba(6,78,59,.5)}
.ben{grid-template-columns:1fr 1fr;gap:12px}.bi{flex-direction:column;align-items:flex-start;gap:6px}
.sh h2{font-size:22px}.grid{grid-template-columns:1fr}.cta{padding:130px 20px 20px;background:linear-gradient(180deg,rgba(6,95,70,0) 0,rgba(6,95,70,0) 60px,#065F46 135px),var(--bimg) top center/cover no-repeat,#065F46;flex-direction:column;align-items:flex-start}.cta .btn{width:100%}
.cats{grid-template-columns:1fr 1fr}.fg{grid-template-columns:1fr 1fr}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom,0))}
.tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0));z-index:30}
.tabbar a{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mut);min-width:60px;min-height:44px;justify-content:center}.tabbar a.on{color:var(--g);font-weight:600}
.tabbar .plus{background:var(--g);color:#fff;border-radius:50%;width:48px;height:48px;min-width:48px;margin-top:-18px;font-size:26px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}
</style>

function legal(t){var aviso='<div class="lock"><b>Rascunho.</b> Este texto é um ponto de partida e <b>deve ser revisto por um advogado</b> antes do lançamento, incluindo as obrigações de proteção de dados em Angola. Os campos “por definir” têm de ser preenchidos.</div>';
if(t==="termos")A.innerHTML='<div class="box"><h1>Termos de utilização</h1>'+aviso+
'<h2>1. O que é o Seu Novo Lar</h2><p>Plataforma onde utilizadores publicam e procuram imóveis para venda e arrendamento. O Seu Novo Lar não é parte nos negócios entre anunciantes e interessados.</p>'+
'<h2>2. Contas</h2><p>Para publicar anúncios é necessário criar uma conta com dados verdadeiros. És responsável pela tua palavra-passe e pela atividade da tua conta.</p>'+
'<h2>3. Anúncios</h2><p>O anunciante é responsável pela veracidade das informações e das fotografias, e confirma ter direito a anunciar o imóvel. Anúncios que violem estas regras podem ser suspensos ou removidos, com indicação do motivo.</p>'+
'<h2>4. Subscrição e acesso a informações</h2><p>Parte das informações dos anúncios (por exemplo contactos, localização exata e descrição completa) está reservada a subscritores com subscrição ativa. Preços e duração: por definir.</p>'+
'<h2>5. Destaques</h2><p>O destaque dura 7 dias e coloca o anúncio em posição de maior visibilidade. Depois disso o anúncio continua publicado na posição normal. O destaque não dá acesso a informações reservadas.</p>'+
'<h2>6. Pagamentos</h2><p>Os pagamentos são confirmados por um administrador, depois de analisar o comprovativo. Um pedido pendente ou em análise não ativa o produto. Política de cancelamento, reembolsos e pagamentos duplicados: por definir.</p>'+
'<h2>7. Denúncias e moderação</h2><p>Qualquer utilizador pode denunciar um anúncio. Uma denúncia não prova, por si só, qualquer infração. O administrador analisa, pode pedir correções e decidir manter, suspender ou remover. Procedimento de contestação: por definir.</p>'+
'<h2>8. Limitação de responsabilidade</h2><p>Por definir com apoio jurídico.</p><h2>9. Contacto</h2><p>Por definir.</p></div>';
else A.innerHTML='<div class="box"><h1>Política de privacidade</h1>'+aviso+
'<h2>1. Que dados recolhemos</h2><p>E-mail, nome (se o indicares) e palavra-passe (guardada de forma protegida pelo serviço de autenticação). Dados dos anúncios: textos, fotografias, preço, localização e telefone de contacto. Comprovativos de pagamento enviados por ti. Registos de ações administrativas.</p>'+
'<h2>2. Para que usamos</h2><p>Gerir a tua conta e os teus anúncios, controlar o acesso às informações reservadas, confirmar pagamentos, moderar conteúdos e prevenir abusos.</p>'+
'<h2>3. Quem vê o quê</h2><p>O telefone, a localização exata, a descrição completa e o nome do anunciante só são mostrados a subscritores com subscrição ativa. Os comprovativos só são vistos por ti e pelos administradores.</p>'+
'<h2>4. Onde ficam os dados</h2><p>Num serviço de base de dados e armazenamento (Supabase). Região e subcontratantes: por definir.</p>'+
'<h2>5. Durante quanto tempo</h2><p>Prazos de conservação: por definir.</p><h2>6. Os teus direitos</h2><p>Aceder, corrigir e apagar os teus dados. Podes apagar os teus anúncios no site. Como pedir o apagamento da conta: por definir.</p><h2>7. Contacto</h2><p>Por definir.</p></div>'}
